site_url: https://ben-santana.github.io/meta-neural-py/
repo_url: https://github.com/Ben-Santana/meta-neural-py
site_name: meta-neural-py
site_description: Experimental Python access to Meta Neural Band gestures, motion, and EMG.
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
plugins:
  - search
hooks:
  - docs/hooks.py
exclude_docs: |
  hooks.py
nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Usage:
      - Python usage: usage.md
      - Public API: api.md
      - Data format and replay: data-format.md
  - Troubleshooting: troubleshooting.md
  - Architecture and trust: setup.md
  - Validation:
      - Release status: validation.md
      - Hardware testing: hardware-testing.md
  - Contributing: contributing.md
  - Publishing: publishing.md
markdown_extensions:
  - fenced_code
  - toc:
      permalink: true
